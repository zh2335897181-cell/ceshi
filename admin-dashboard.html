<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMIÈRE 美学沙龙 - 管理后台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="app">
    <!-- 侧边栏 -->
    <aside class="fixed left-0 top-0 h-full w-64 bg-white border-r border-gray-200">
      <div class="p-6 border-b border-gray-200">
        <h1 class="text-xl font-bold text-gray-900">LUMIÈRE</h1>
        <p class="text-sm text-gray-500 mt-1">美学沙龙管理后台</p>
      </div>
      
      <nav class="p-4 space-y-2">
        <button onclick="showTab('dashboard')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors bg-amber-100 text-amber-800" data-tab="dashboard">
          <span class="text-xl">📊</span>
          <span class="font-medium">数据概览</span>
        </button>
        <button onclick="showTab('services')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors text-gray-600 hover:bg-gray-100" data-tab="services">
          <span class="text-xl">✨</span>
          <span class="font-medium">服务管理</span>
        </button>
        <button onclick="showTab('staff')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors text-gray-600 hover:bg-gray-100" data-tab="staff">
          <span class="text-xl">👥</span>
          <span class="font-medium">技师管理</span>
        </button>
        <button onclick="showTab('appointments')" class="tab-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors text-gray-600 hover:bg-gray-100" data-tab="appointments">
          <span class="text-xl">📅</span>
          <span class="font-medium">预约管理</span>
        </button>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="ml-64 p-8">
      <!-- 数据概览 -->
      <div id="dashboard" class="tab-content">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">数据概览</h2>
        <div class="grid grid-cols-4 gap-6" id="stats-cards">
          <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <span class="text-3xl">✨</span>
              <span class="px-3 py-1 rounded-full text-sm font-medium bg-blue-50 text-blue-600">服务项目</span>
            </div>
            <div class="text-3xl font-bold text-gray-900" id="total-services">-</div>
          </div>
          <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <span class="text-3xl">👥</span>
              <span class="px-3 py-1 rounded-full text-sm font-medium bg-green-50 text-green-600">专业技师</span>
            </div>
            <div class="text-3xl font-bold text-gray-900" id="total-staff">-</div>
          </div>
          <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <span class="text-3xl">📅</span>
              <span class="px-3 py-1 rounded-full text-sm font-medium bg-purple-50 text-purple-600">今日预约</span>
            </div>
            <div class="text-3xl font-bold text-gray-900" id="today-appointments">-</div>
          </div>
          <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <span class="text-3xl">💰</span>
              <span class="px-3 py-1 rounded-full text-sm font-medium bg-amber-50 text-amber-600">本月收入</span>
            </div>
            <div class="text-3xl font-bold text-gray-900" id="month-revenue">-</div>
          </div>
        </div>
      </div>

      <!-- 服务管理 -->
      <div id="services" class="tab-content hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-gray-900">服务管理</h2>
        </div>
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">服务名称</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">分类</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">价格</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">时长</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">状态</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="services-table">
              <tr><td colspan="5" class="px-6 py-12 text-center text-gray-500">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 技师管理 -->
      <div id="staff" class="tab-content hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-gray-900">技师管理</h2>
        </div>
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">姓名</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">职位</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">擅长</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">经验</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">评分</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="staff-table">
              <tr><td colspan="5" class="px-6 py-12 text-center text-gray-500">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 预约管理 -->
      <div id="appointments" class="tab-content hidden">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">预约管理</h2>
        <div class="bg-white rounded-lg shadow overflow-hidden">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">预约编号</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">客户姓名</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">联系电话</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">预约时间</th>
                <th class="px-6 py-3 text-left text-sm font-medium text-gray-500">状态</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-200" id="appointments-table">
              <tr><td colspan="5" class="px-6 py-12 text-center text-gray-500">暂无预约记录</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = `${window.MEOO_CONFIG?.meoo_app_access_url || location.origin}/sb-api`;
    const SUPABASE_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzgxNTgzNjU3LCJleHAiOjEzMjkyMjIzNjU3fQ.tCujtUzJ0ERVCeXnPucPTaSqKgx5E8AvzVsed4vd3q0';

    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(tabName).classList.remove('hidden');
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-amber-100', 'text-amber-800');
        btn.classList.add('text-gray-600', 'hover:bg-gray-100');
      });
      const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
      activeBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');
      activeBtn.classList.add('bg-amber-100', 'text-amber-800');
    }

    async function fetchData() {
      try {
        // 获取统计数据
        const [servicesRes, staffRes, appointmentsRes] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/services?select=*`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          }),
          fetch(`${SUPABASE_URL}/rest/v1/staff?select=*`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          }),
          fetch(`${SUPABASE_URL}/rest/v1/appointments?select=*`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          })
        ]);

        const services = await servicesRes.json();
        const staff = await staffRes.json();
        const appointments = await appointmentsRes.json();

        // 更新统计卡片
        document.getElementById('total-services').textContent = services.length || 0;
        document.getElementById('total-staff').textContent = staff.length || 0;
        
        const today = new Date().toISOString().split('T')[0];
        const todayCount = appointments.filter(a => a.date === today).length;
        document.getElementById('today-appointments').textContent = todayCount;
        
        const revenue = appointments.reduce((sum, a) => sum + (parseFloat(a.service_price) || 0), 0);
        document.getElementById('month-revenue').textContent = `¥${revenue}`;

        // 更新服务列表
        const servicesTable = document.getElementById('services-table');
        if (services.length > 0) {
          servicesTable.innerHTML = services.map(s => `
            <tr>
              <td class="px-6 py-4">${s.name}</td>
              <td class="px-6 py-4 text-sm text-gray-500">${s.category || '-'}</td>
              <td class="px-6 py-4">¥${s.price}</td>
              <td class="px-6 py-4">${s.duration}分钟</td>
              <td class="px-6 py-4">
                <span class="px-2 py-1 rounded text-xs ${s.is_active ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-600'}">
                  ${s.is_active ? '已上架' : '已下架'}
                </span>
              </td>
            </tr>
          `).join('');
        } else {
          servicesTable.innerHTML = '<tr><td colspan="5" class="px-6 py-12 text-center text-gray-500">暂无服务数据</td></tr>';
        }

        // 更新技师列表
        const staffTable = document.getElementById('staff-table');
        if (staff.length > 0) {
          staffTable.innerHTML = staff.map(s => `
            <tr>
              <td class="px-6 py-4 font-medium">${s.name}</td>
              <td class="px-6 py-4 text-sm text-gray-600">${s.title || '-'}</td>
              <td class="px-6 py-4 text-sm">${Array.isArray(s.specialties) ? s.specialties.join(', ') : '-'}</td>
              <td class="px-6 py-4 text-sm">${s.years_of_experience || 0}年</td>
              <td class="px-6 py-4 text-sm">⭐ ${s.rating || 0}</td>
            </tr>
          `).join('');
        } else {
          staffTable.innerHTML = '<tr><td colspan="5" class="px-6 py-12 text-center text-gray-500">暂无技师数据</td></tr>';
        }

        // 更新预约列表
        const appointmentsTable = document.getElementById('appointments-table');
        if (appointments.length > 0) {
          const statusMap = { pending: '待到店', completed: '已完成', cancelled: '已取消' };
          const statusColors = { pending: 'bg-yellow-100 text-yellow-800', completed: 'bg-green-100 text-green-800', cancelled: 'bg-gray-100 text-gray-800' };
          
          appointmentsTable.innerHTML = appointments.map(a => `
            <tr>
              <td class="px-6 py-4 text-sm">${a.reservation_no}</td>
              <td class="px-6 py-4 text-sm">${a.user_name}</td>
              <td class="px-6 py-4 text-sm">${a.user_phone}</td>
              <td class="px-6 py-4 text-sm">${a.date} ${a.time}</td>
              <td class="px-6 py-4">
                <span class="px-2 py-1 rounded text-xs ${statusColors[a.status] || 'bg-gray-100'}">
                  ${statusMap[a.status] || a.status}
                </span>
              </td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('加载数据失败:', err);
      }
    }

    // 页面加载时获取数据
    fetchData();
  </script>
</body>
</html>
